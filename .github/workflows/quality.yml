name: Checks and builds

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: project/erbium-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: project/erbium-ui
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: project/erbium-ui
          node-version-file: .node-version
          run-install: false
      - name: Verify shallow deploy checkout
        run: |
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          git clone --quiet --depth 1 --no-tags "file://$PWD" "$fixture/checkout"
          commit=$(git -C "$fixture/checkout" rev-parse HEAD)
          test "$(git -C "$fixture/checkout" rev-parse --is-shallow-repository)" = true
          sh "$fixture/checkout/packages/infra/scripts/prepare-history.sh"
          test "$(git -C "$fixture/checkout" rev-parse --is-shallow-repository)" = false
          test "$(git -C "$fixture/checkout" rev-parse HEAD)" = "$commit"
      - name: Install dependencies
        run: vp install --frozen-lockfile
      - name: Verify managed CLI installs and updates
        run: vp run --filter ./packages/cli --fail-if-no-match test
      - name: Verify the committed registry is current
        run: vp run registry:check
      - name: Validate and build applications
        run: vp run ready
      - name: Typecheck infrastructure
        run: vp run infra:typecheck
